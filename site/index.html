<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tokens go brrr — see which ai coding limit runs out first</title>
<meta name="description" content="See which of your AI coding limits runs out first, from your GNOME top bar. Works with Cursor, Claude Code, OpenCode, Pi and Codex. Download for Fedora and Debian/Ubuntu.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@400;500;600;700&display=swap" rel="stylesheet">
<meta name="color-scheme" content="light dark">
<link rel="stylesheet" href="styles.css">
<script src="theme.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="i18n.js"></script>
<script src="ds_bundle.js"></script>
<script>window.__AIU_KIT__ = true;</script>
<style>
html{scroll-behavior:auto}html[data-lower] #site,html[data-lower] #site *{text-transform:lowercase!important}body{margin:0;background:var(--color-bg)}

@keyframes tgb-shake{0%,100%{transform:translate(0,0)}25%{transform:translate(-1px,1px)}50%{transform:translate(1px,-1px)}75%{transform:translate(-1px,0)}}
@keyframes tgb-flick{0%,100%{opacity:1}50%{opacity:.55}}
.tgb-shake{animation:tgb-shake 90ms linear infinite}.tgb-brrr{animation:tgb-flick 180ms steps(2) infinite}
@media (prefers-reduced-motion:reduce){.tgb-shake,.tgb-brrr{animation:none}}
</style>
</head>
<body><div id="site"></div>
<noscript><p style="padding:24px;font:16px sans-serif">Tokens go brrr needs JavaScript. Releases: <a href="https://github.com/fredrickmakoffu/cursor-spend-monitor-releases/releases">github.com/fredrickmakoffu/cursor-spend-monitor-releases/releases</a></p></noscript>
<script type="text/babel" src="data.jsx"></script>
<script type="text/babel" src="Screens.jsx"></script>
<script type="text/babel" src="burn.jsx"></script>
<script type="text/babel" src="Shared.jsx"></script>
<script type="text/babel" src="releases.jsx"></script>
<script type="text/babel" src="Directions.jsx"></script>
<script type="text/babel">
function Site() {
  const [lang, setLang] = React.useState(I18N.locale());
  React.useEffect(() => I18N.subscribe(setLang), []);
  // Keyed on mode as well as the resolved theme: auto -> light changes the
  // toggle's icon without changing what is drawn.
  const [, setTheme] = React.useState(THEME.mode() + THEME.resolved());
  React.useEffect(() => THEME.subscribe((r) => setTheme(THEME.mode() + r)), []);
  const dark = THEME.resolved() === "dark";
  const b = useBurn(1);
  const [dismissed, setDismissed] = React.useState(false);
  React.useEffect(() => { if (!b.limited) setDismissed(false); }, [b.limited]);
  return (<>
    <DirB key={lang} b={b} dark={dark} />
    {b.limited && !dismissed && <LimitModal key={lang} b={b} dark={dark} onDismiss={() => setDismissed(true)} />}
  </>);
}
ReactDOM.createRoot(document.getElementById("site")).render(<Site />);
</script>
</body>
</html>
