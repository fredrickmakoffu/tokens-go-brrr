name: Release

# Push a tag like v0.6.0 on main. The build lands as a DRAFT release: audit the
# artifacts, then press "Publish" on GitHub. Nothing is public until you do.
#
# Merging to main starts the same build when the version in the code has no tag
# yet, so shipping is: bump the version, merge, then press "Publish" on the
# draft. A merge that leaves the version alone releases nothing.
#
# No terminal? Open Actions > Release > Run workflow on main. It reads the
# version from the code, builds and tests exactly as for a tag, and only then
# creates the v<version> tag on that commit and the draft release. Nothing is
# public until you press "Publish" on the draft, as always.
on:
  push:
    tags: ['v*']
    branches: [main]
  workflow_dispatch:

# Two merges in quick succession must not race to tag the same version.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # A tag push names its own tag. A manual run or a merge to main has none yet,
  # so it derives one from the code, and only from main: anyone who can run
  # workflows must not be able to release a feature branch. A merge whose
  # version is already tagged is not a release and stops here.
  plan:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      skip: ${{ steps.tag.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Work out the tag
        id: tag
        run: |
          skip=false
          if [ "${GITHUB_EVENT_NAME}" = "push" ] && [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
          else
            test "${GITHUB_REF}" = "refs/heads/main" \
              || { echo "run this workflow from main, not ${GITHUB_REF}"; exit 1; }
            tag="v$(python3 scripts/bump_version.py --print)"
            if [ "${GITHUB_EVENT_NAME}" = "push" ] \
               && git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
              skip=true
              echo "${tag} is already tagged: nothing to release" >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "skip=${skip}" >> "$GITHUB_OUTPUT"
          echo "Releasing ${tag} from ${GITHUB_SHA} (skip=${skip})"

  linux:
    needs: [plan]
    if: needs.plan.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Full history: make_manifest.py diffs against the previous tag.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag must match the version in the code
        env:
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          test "v$(python3 scripts/bump_version.py --print)" = "${TAG}" \
            || { echo "tag ${TAG} != pyproject version"; exit 1; }
          python3 scripts/bump_version.py --check

      - name: Tag must be on main
        run: |
          git fetch origin main --depth=1000
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "tag is not reachable from main"; exit 1; }

      - run: sudo apt-get update -qq && sudo apt-get install -y -qq python3-gi gir1.2-notify-0.7
      - run: python3 -m unittest discover -s tests
      - run: make rpm deb smoke
      - run: python3 scripts/make_manifest.py dist

      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: dist/*
          retention-days: 14

  # Windows (.exe) and macOS (.dmg) jobs join here once those builds exist.
  # Keep them to tag pushes only: on the free plan Windows minutes count 2x and
  # macOS minutes count 10x against the monthly allowance.

  draft-release:
    needs: [plan, linux]
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.plan.outputs.tag }}
    steps:
      # The commit that was built and tested, not whatever main has moved to.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # Merges and manual runs create the tag here, after the build and tests have passed,
      # so a broken build leaves no tag behind. A tag pushed with the workflow's
      # own token does not start another run. Re-running is safe: a tag already
      # on this commit is kept, one on any other commit stops the release.
      - name: Create the tag (merges and manual runs)
        if: github.ref_type != 'tag'
        run: |
          git fetch --tags --quiet origin
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            test "$(git rev-list -n1 "${TAG}")" = "${GITHUB_SHA}" \
              || { echo "${TAG} already exists on another commit"; exit 1; }
            echo "${TAG} already points at ${GITHUB_SHA}"
          else
            git config user.name "release-bot"
            git config user.email "release-bot@users.noreply.github.com"
            git tag -a "${TAG}" "${GITHUB_SHA}" -m "${TAG}"
            git push origin "refs/tags/${TAG}"
          fi

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${TAG}" dist/* \
            --draft --verify-tag --generate-notes --title "${TAG}"
