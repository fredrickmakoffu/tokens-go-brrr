name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # The daemon imports PyGObject, which only exists as a distro package, so
      # use the system Python rather than setup-python.
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq python3-gi gir1.2-notify-0.7
      - run: pip3 install --user -q ruff
      - run: python3 scripts/bump_version.py --check
      - run: make lint
      - run: make format-check
      - run: python3 -m unittest discover -s tests
      - run: python3 scripts/check_contrast.py
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: python3 -m unittest tests.test_locales -v

  # Prove the packages still build on every PR into main, so a release never
  # is the first time they are tried. Linux only: cheap on the free plan.
  packages:
    if: github.base_ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: make rpm deb smoke
