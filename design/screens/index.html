:root {
  /* tokens from stylesheet.css */
  --ok: #3ddc84;
  --wait: #e8930f;
  --crit: #ff5c5c;
  --error: #6c6d70;
  --panel-bg: #24282f;
  --panel-border: #474a50;
  --panel-radius: 13px;
  --rule: #363940;
  --hover-bg: #2f3339;
  --fg: #f0f0f0;
  --muted: #a3a5a8;
  --faint: #73757a;
  --dim: #6c6d70;
  --chip-bg: #474a50;
  --btn-bg: #3a3e44;
  --btn-hover: #4a5058;
  --focus: #6f9cff;
  --track: rgba(255, 255, 255, 0.13);
  --base: 14.6667px; /* Adwaita Sans 11pt at 96dpi */
}
* { box-sizing: content-box; margin: 0; padding: 0; }
html, body { background: #121214; }
body { font-family: "Adwaita Sans", sans-serif; font-size: var(--base); color: var(--fg); }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; text-align: center; }
svg { display: block; flex: none; }

/* Pango sizes a line as ceil(ascent)+ceil(descent) of the hhea metrics (1984/494 per 2048 em). */
.popover, .popover * {
  line-height: calc(round(up, 0.96875em, 1px) + round(up, 0.24121em, 1px));
  font-optical-sizing: none;
}
/* Popover chrome */
.popover {
  width: 358px;
  background: var(--panel-bg);
  border: 1px solid var(--panel-border);
  border-radius: var(--panel-radius);
  color: var(--fg);
  font-size: var(--base);
  font-weight: 400;
  overflow: hidden;
  font-feature-settings: normal;
}
.screen { display: flex; flex-direction: column; }
.hbox { display: flex; flex-direction: row; }
.vbox { display: flex; flex-direction: column; }
.grow { flex: 1 1 0; min-width: 0; }
.tnum { font-feature-settings: "tnum"; }

/* Header */
.ai-usage-header { display: flex; align-items: center; padding: 10px 10px 10px 16px; gap: 2px; border-bottom: 1px solid transparent; /* St draws no visible rule here in the reference */ }
.ai-usage-header-title { font-size: 0.95em; font-weight: 700; flex: 1; margin-bottom: 1px; }
.ai-usage-header-btn { padding: 4px 8px; border-radius: 6px; background: transparent; color: var(--muted); font-size: 0.8em; font-weight: 400; }
.ai-usage-header-btn:hover { background: var(--hover-bg); color: var(--fg); }

/* List */
.ai-usage-section { padding: 6px 0; display: flex; flex-direction: column; }
.ai-usage-row { display: flex; align-items: center; padding: 9px 14px 9px 16px; gap: 12px; min-height: 40px; background: transparent; color: var(--fg); cursor: pointer; }
.ai-usage-row:hover { background: var(--hover-bg); }
.ai-usage-badge { width: 26px; height: 26px; border: 1px solid var(--panel-border); border-radius: 9px; color: var(--muted); display: flex; align-items: center; justify-content: center; flex: none; }
.ai-usage-badge-via { border-color: rgba(255,255,255,0.12); }
.ai-usage-info { display: flex; flex-direction: column; flex: 1 1 0; min-width: 0; justify-content: center; }
.ai-usage-name-row { display: flex; align-items: center; gap: 7px; }
.ai-usage-name { font-size: 1em; font-weight: 600; white-space: nowrap; }
.ai-usage-running { font-size: 0.82em; color: var(--muted); white-space: nowrap; }
.ai-usage-via { font-size: 0.78em; color: var(--muted); padding: 1px 5px; border-radius: 6px; background: rgba(255,255,255,0.07); white-space: nowrap; }
.ai-usage-via-note { font-size: 0.85em; color: var(--muted); padding-bottom: 4px; }
.ai-usage-meta { padding-top: 2px; display: flex; flex-wrap: wrap; gap: 4px 7px; }
.ai-usage-limit { font-size: 0.85em; color: var(--muted); font-feature-settings: "tnum"; white-space: nowrap; }
.ai-usage-bar { margin-top: 9px; height: 8px; background: var(--track); border-radius: 4px; }
.ai-usage-bar-fill { height: 8px; border-radius: 4px; }
.ai-usage-value { font-size: 1.45em; font-weight: 700; font-feature-settings: "tnum"; }
.ai-usage-chevron { color: var(--faint); }

/* Window picker */
.ai-usage-windowbar { display: flex; border-top: 1px solid var(--rule); border-radius: 0 0 var(--panel-radius) var(--panel-radius); }
.ai-usage-window-btn { flex: 1 1 0; height: 36px; padding: 0; border-radius: 0; background: transparent; color: var(--muted); font-size: 0.82em; font-weight: 400; }
.ai-usage-window-btn:first-child { border-radius: 0 0 0 var(--panel-radius); }
.ai-usage-window-btn:last-child { border-radius: 0 0 var(--panel-radius) 0; }
.ai-usage-window-btn:hover { background: var(--hover-bg); color: var(--fg); }
.ai-usage-window-btn.selected { color: var(--fg); font-weight: 600; /* St does not paint the inset accent rule */ }

/* Detail */
.ai-usage-detail-header { display: flex; align-items: center; padding: 12px 16px; gap: 10px; border-bottom: 1px solid transparent; }
.ai-usage-back { padding: 3px; border-radius: 6px; background: transparent; color: var(--muted); display: flex; }
.ai-usage-back:hover { background: var(--hover-bg); color: var(--fg); }
.ai-usage-detail-title { font-size: 1em; font-weight: 700; }
.ai-usage-detail-body { padding: 16px 16px 6px 16px; display: flex; flex-direction: column; gap: 18px; }
.ai-usage-metric-top { display: flex; font-size: 1em; font-weight: 600; color: var(--fg); }
.ai-usage-detail-value { font-size: 1.45em; font-weight: 700; font-feature-settings: "tnum"; }
.ai-usage-detail-reset { padding-top: 6px; font-size: 0.85em; color: var(--muted); font-feature-settings: "tnum"; }
.ai-usage-sessions-block { display: flex; flex-direction: column; gap: 8px; padding-top: 4px; }
.ai-usage-sessions-heading { font-size: 0.8em; font-weight: 600; color: var(--muted); }
.ai-usage-sessions-empty { font-size: 0.85em; color: var(--muted); }
.ai-usage-session-row { display: flex; align-items: center; gap: 10px; }
.ai-usage-session-mark { width: 7px; height: 7px; border-radius: 999px; background: var(--ok); }
.ai-usage-session-mark.paused { background: transparent; border: 1px solid var(--faint); }
.ai-usage-session-name { font-size: 0.92em; font-weight: 500; color: var(--fg); flex: 1; }
.ai-usage-session-state { font-size: 0.82em; color: var(--muted); }
.ai-usage-session-model { font-size: 0.78em; color: var(--muted); padding-right: 8px; }
.ai-usage-view-all { margin-top: 4px; padding: 8px 0; border-radius: 0; background: transparent; display: flex; align-items: center; gap: 8px; text-align: left; }
.ai-usage-view-all-label { font-size: 0.92em; font-weight: 500; color: var(--fg); flex: 1; }
.ai-usage-sessions-screen { padding: 14px 16px 16px 16px; display: flex; flex-direction: column; gap: 14px; }
.ai-usage-sessions-stats { font-size: 0.85em; color: var(--muted); font-feature-settings: "tnum"; }
.ai-usage-sessions-filters { display: flex; gap: 8px; }
.ai-usage-filter-chip { padding: 3px 10px; border: 1px solid var(--panel-border); border-radius: 999px; background: transparent; color: var(--muted); font-size: 0.8em; font-weight: 400; }
.ai-usage-filter-chip:hover { background: #3c4046; color: var(--fg); }
.ai-usage-filter-chip.active { border-color: transparent; background: var(--chip-bg); color: var(--fg); }
.ai-usage-sessions-list { display: flex; flex-direction: column; gap: 10px; }
.ai-usage-dash-btn { display: block; margin: 6px 16px 14px 16px; padding: 9px; border: 1px solid var(--panel-border); border-radius: 7px; background: var(--hover-bg); color: var(--fg); font-size: 0.88em; font-weight: 600; text-align: center; }
.ai-usage-dash-btn:hover { background: #3a3e44; }
.ai-usage-dash-btn.ai-usage-refresh-btn { margin-top: 0; }

/* Guide / About */
.ai-usage-guide-body { padding: 14px 16px 16px 16px; display: flex; flex-direction: column; gap: 14px; }
.ai-usage-guide-item { display: flex; gap: 10px; }
.ai-usage-guide-dot { margin-top: 4px; width: 9px; height: 9px; border-radius: 999px; flex: none; }
.ai-usage-guide-text { display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0; }
.ai-usage-guide-title { font-size: 0.95em; font-weight: 700; }
.ai-usage-guide-desc { font-size: 0.85em; color: var(--muted); }

/* Landing */
.ai-usage-landing { padding: 14px 16px 16px 16px; display: flex; flex-direction: column; gap: 10px; }
.ai-usage-landing-quote-row { display: flex; gap: 6px; }
.ai-usage-landing-mark { font-size: 1.8em; font-weight: 700; color: #3a3e44; /* St ignores line-height; natural line box applies */ }
.ai-usage-landing-quote { font-size: 1.18em; font-weight: 600; color: var(--fg); flex: 1; min-width: 0; }
.ai-usage-landing-share { margin-top: 8px; font-size: 0.84em; color: var(--muted); }
.ai-usage-landing-featured { display: flex; gap: 10px; margin-top: 6px; }
.ai-usage-landing-icon { margin-top: 2px; align-self: center; }
.ai-usage-landing-name { font-size: 0.98em; font-weight: 700; color: var(--fg); }
.ai-usage-landing-role { font-size: 0.84em; color: var(--muted); }
.ai-usage-landing-actions { display: flex; justify-content: center; gap: 8px; margin-top: 10px; margin-bottom: 16px; }
.ai-usage-landing-continue { height: 38px; padding: 0 26px; border-radius: 10px; background: var(--btn-bg); color: var(--fg); font-size: 0.92em; font-weight: 600; }
.ai-usage-landing-continue:hover { background: var(--btn-hover); }
.ai-usage-landing-copy { height: 38px; padding: 0 18px; border-radius: 10px; background: transparent; color: var(--muted); font-size: 0.88em; align-self: center; }

/* ---- Helpers mirroring extension.js ---- */
const COLOR = { ok: "#3ddc84", wait: "#e8930f", crit: "#ff5c5c", error: "#6c6d70" };
const colorFor = (pct) => (pct >= 90 ? COLOR.crit : pct >= 70 ? COLOR.wait : COLOR.ok);
const SHORT_LABELS = { "Rolling limit": "RL" };
const shortLabel = (t) => SHORT_LABELS[t] ?? t ?? "—";
const WINDOW_KINDS = [
  { kind: "rolling", label: "Rolling" },
  { kind: "weekly", label: "Weekly" },
  { kind: "monthly", label: "Monthly" },
];
const clampPct = (v) => { const n = Number(v); return Number.isFinite(n) ? Math.max(0, Math.min(100, n)) : 0; };
const activeSessions = (t) => t.instances?.active ?? 0;
const viaOf = (t) => t?.via ?? null;
const hasMeters = (t) => Array.isArray(t?.metrics) && t.metrics.length > 0;
const ownsMeters = (t) => hasMeters(t) && !viaOf(t)?.borrowed;
const metricOf = (t, key) => (t.metrics ?? []).find((m) => m.key === key) ?? null;
const primaryOf = (t) => metricOf(t, t.primary) ?? t.metrics?.[0] ?? null;
const kindOf = (t) => primaryOf(t)?.kind ?? "other";
const sessionRows = (t) => t.instances?.sessions ?? [];
const sessionLabel = (s) => s?.project || (s?.kind === "editor" ? "Desktop" : "Session");
function windowsOffered(tools) {
  const seen = new Set();
  for (const t of tools) for (const m of t.metrics ?? []) seen.add(m.kind);
  return WINDOW_KINDS.filter((w) => seen.has(w.kind));
}
function selectedWindow(tools) {
  const tally = new Map();
  for (const t of tools) {
    if (!hasMeters(t) || !ownsMeters(t)) continue;
    const k = kindOf(t);
    if (k === "other") continue;
    tally.set(k, (tally.get(k) ?? 0) + 1);
  }
  let best = null;
  for (const [k, c] of tally) if (!best || c > best[1]) best = [k, c];
  return best ? best[0] : null;
}
// Bulk swap, as Indicator._selectWindow does through SetPrimary.
function withWindow(tools, kind) {
  return tools.map((t) => {
    if (!hasMeters(t) || !ownsMeters(t)) return t;
    const match = t.metrics.find((m) => m.kind === kind);
    return match ? { ...t, primary: match.key } : t;
  });
}
function relativeTime(iso) {
  const secs = Math.max(0, Math.round((NOW - Date.parse(iso)) / 1000));
  if (secs < 60) return "just now";
  if (secs < 3600) return `${Math.round(secs / 60)}m ago`;
  if (secs < 86400) return `${Math.round(secs / 3600)}h ago`;
  return `${Math.round(secs / 86400)}d ago`;
}

function Chevron({ dir, size, className }) {

  );
}

const PI_D = "M3.6 6.4h16.8v2.5h-3.3v7.4c0 .7.3 1 .9 1 .5 0 .9-.2 1.3-.5l.9 2c-.8.6-1.7.9-2.8.9-2 0-3.1-1.1-3.1-3.2V8.9h-3.5l-.4 5.1c-.2 2.4-.7 4.1-1.5 5.2-.8 1-2 1.5-3.5 1.5l-.5-2.4c.8-.1 1.4-.4 1.8-1 .4-.7.7-1.9.8-3.6l.4-4.8H3.6z";
function ProviderIcon({ id, size }) {
  if (id === "cursor") return <img src={CURSOR_PNG} width={size} height={size} style={{ display: "block" }} alt="" />;
  const spec = { claude: [CLAUDE_D, "#D97757"], opencode: [OPENCODE_D, "#98999d"], pi: [PI_D, "#98999d"] }[id];
  if (!spec) return null;
  return <svg width={size} height={size} viewBox="0 0 24 24"><path d={spec[0]} fill={spec[1]} fillRule="nonzero" /></svg>;
}

/* ---- Components ---- */
function Badge({ icon, via }) {
  return (
    <div className={"ai-usage-badge" + (via ? " ai-usage-badge-via" : "")}>
      <ProviderIcon id={icon} size={15} />
    </div>
  );
}

function Meter({ pct, color }) {
  return (
    <div className="ai-usage-bar">
      <div className="ai-usage-bar-fill" style={{ width: pct + "%", background: color }} />
    </div>
  );
}

function Header({ title, withSettings, latest, nav }) {
  return (
    <div className="ai-usage-header">
      <span className="ai-usage-header-title">{title}</span>
      {latest && <button className="ai-usage-header-btn" onClick={() => nav("landing", { mode: "latest" })}>Latest</button>}
      {withSettings && <button className="ai-usage-header-btn">Settings</button>}
      <button className="ai-usage-header-btn" onClick={() => nav("guide")}>Guide</button>
      <button className="ai-usage-header-btn" onClick={() => nav("about")}>About</button>
    </div>
  );
}

function DetailHeader({ title, icon, back }) {
  return (
    <div className="ai-usage-detail-header">
      <button className="ai-usage-back" aria-label="Back" onClick={back}><Chevron dir="left" size={16} /></button>
      {icon && <Badge icon={icon} />}
      <span className="ai-usage-detail-title">{title}</span>
    </div>
  );
}

function ProviderRow({ tool, selectedKind, onOpen }) {
  const ok = !tool.status || tool.status === "ok";
  const primary = primaryOf(tool);
  const pct = clampPct(primary?.value ?? 0);
  const color = colorFor(pct);
  const via = viaOf(tool);
  const metered = ok && hasMeters(tool);
  const running = ok ? activeSessions(tool) : 0;
  const honoured = !selectedKind || kindOf(tool) === selectedKind;
  return (
    <div className="ai-usage-row" onClick={ok ? onOpen : undefined} style={ok ? null : { opacity: 140 / 255 }}>
      <Badge icon={tool.icon} via={!!via} />
      <div className="ai-usage-info">
        <div className="ai-usage-name-row">
          <span className="ai-usage-name">{tool.name}</span>
          {via && <span className="ai-usage-via">via {via.name}</span>}
          {running > 0 && <span className="ai-usage-running">{running} running</span>}
        </div>
        <div className="ai-usage-meta">
          {metered
            ? !honoured && <span className="ai-usage-limit">{shortLabel(primary?.label)}</span>
            : <span className="ai-usage-limit">{tool.error || tool.status || "No limits"}</span>}
        </div>
        {metered && <Meter pct={pct} color={color} />}
      </div>
      {ok && metered && <span className="ai-usage-value" style={{ color }}>{Math.round(pct)}%</span>}
      {ok && <Chevron dir="right" size={14} className="ai-usage-chevron" />}
    </div>
  );
}

function WindowPicker({ tools, selectedKind, onSelect }) {
  const offered = windowsOffered(tools);
  if (offered.length < 2) return null;
  return (
    <div className="ai-usage-windowbar">
      {offered.map(({ kind, label }) => (
        <button key={kind} className={"ai-usage-window-btn" + (kind === selectedKind ? " selected" : "")}
          onClick={() => kind !== selectedKind && onSelect(kind)}>{label}</button>
      ))}
    </div>
  );
}

function ListScreen({ tools, nav, hasLatest, onWindow }) {
  const selectedKind = selectedWindow(tools);
  return (
    <>
      <Header title="AI usage" withSettings latest={hasLatest} nav={nav} />
      {tools.length === 0 ? (
        <div className="ai-usage-empty">{"No providers yet.\nSign in to Cursor and refresh."}</div>
      ) : (
        <>
          <div className="ai-usage-section">
            {tools.map((t) => (
              <ProviderRow key={t.id} tool={t} selectedKind={selectedKind} onOpen={() => nav("detail", { toolId: t.id })} />
            ))}
          </div>
          <WindowPicker tools={tools} selectedKind={selectedKind} onSelect={onWindow} />
        </>
      )}
    </>
  );
}

function SessionRow({ session }) {
  return (
    <div className="ai-usage-session-row">
      <span className={"ai-usage-session-mark" + (session.paused ? " paused" : "")} />
      <span className="ai-usage-session-name">{sessionLabel(session)}</span>
      {session.backend?.model && <span className="ai-usage-session-model">{session.backend.model}</span>}
      <span className="ai-usage-session-state">{session.paused ? "paused" : "running"}</span>
    </div>
  );
}

function MetricBlock({ m }) {
  const pct = clampPct(m.value);
  const color = colorFor(pct);
  return (
    <div className="vbox">
      <div className="ai-usage-metric-top">
        <span className="grow">{m.label}</span>
        <span className="ai-usage-detail-value" style={{ color }}>{Math.round(pct)}%</span>
      </div>
      <Meter pct={pct} color={color} />
      <span className="ai-usage-detail-reset">{m.resets ?? ""}</span>
    </div>
  );
}

function SessionsBlock({ tool, onViewAll }) {
  const sessions = sessionRows(tool);
  const active = sessions.filter((s) => !s.paused);
  return (
    <div className="ai-usage-sessions-block">
      <span className="ai-usage-sessions-heading">Sessions</span>
      {active.length ? active.map((s, i) => <SessionRow key={i} session={s} />)
        : <span className="ai-usage-sessions-empty">No active sessions</span>}
      <button className="ai-usage-view-all" onClick={onViewAll}>
        <span className="ai-usage-view-all-label">View all sessions</span>
        <Chevron dir="right" size={14} className="ai-usage-chevron" />
      </button>
    </div>
  );
}

function DetailScreen({ tool, nav }) {
  const via = viaOf(tool);
  const note = via && (via.borrowed
    ? `Spending against ${via.name}${via.model ? ` · ${via.model}` : ""}`
    : `${via.name}${via.model ? ` · ${via.model}` : ""} — ${tool.error || "no limits available"}`);
  return (
    <>
      <DetailHeader title={tool.name} icon={tool.icon} back={() => nav("list")} />
      <div className="ai-usage-detail-body">
        {via && <span className="ai-usage-via-note">{note}</span>}
        {(tool.metrics ?? []).map((m) => <MetricBlock key={m.key} m={m} />)}
        {sessionRows(tool).length > 0 && <SessionsBlock tool={tool} onViewAll={() => nav("sessions", { toolId: tool.id })} />}
      </div>
      <button className="ai-usage-dash-btn">Open dashboard</button>
    </>
  );
}

function FilterChips({ active, paused, filter, setFilter }) {
  return (
    <div className="ai-usage-sessions-filters">
      {[["active", "Active", active], ["paused", "Paused", paused]].map(([key, text, n]) => (
        <button key={key} className={"ai-usage-filter-chip" + (filter === key ? " active" : "")}
          onClick={() => setFilter(key)}>{text} {n}</button>
      ))}
    </div>
  );
}

function SessionList({ tool, nav, filter, setFilter }) {
  const sessions = sessionRows(tool);
  const active = sessions.filter((s) => !s.paused);
  const paused = sessions.filter((s) => s.paused);
  const shown = filter === "paused" ? paused : active;
  return (
    <>
      <DetailHeader title="Sessions" icon={tool.icon} back={() => nav("detail", { toolId: tool.id })} />
      <div className="ai-usage-sessions-screen">
        <span className="ai-usage-sessions-stats">{`${active.length} active · ${paused.length} paused · ${sessions.length} total`}</span>
        <FilterChips active={active.length} paused={paused.length} filter={filter} setFilter={setFilter} />
        <div className="ai-usage-sessions-list">
          {shown.length ? shown.map((s, i) => <SessionRow key={i} session={s} />)
            : <span className="ai-usage-sessions-empty">{filter === "paused" ? "No paused sessions" : "No active sessions"}</span>}
        </div>
      </div>
    </>
  );
}

function LandingQuote({ billboard }) {
  return (
    <>
      <div className="ai-usage-landing-quote-row">
        <span className="ai-usage-landing-mark" style={{ alignSelf: "flex-start" }}>{"“"}</span>
        <span className="ai-usage-landing-quote">{billboard.text}</span>
        <span className="ai-usage-landing-mark" style={{ alignSelf: "flex-end" }}>{"”"}</span>
      </div>
      {billboard.share && <span className="ai-usage-landing-share">{billboard.share}</span>}
      {(billboard.featured?.name || billboard.featured?.providerId) && (
        <div className="ai-usage-landing-featured">
          <div className="ai-usage-landing-icon"><ProviderIcon id={billboard.featured.providerId ?? "cursor"} size={22} /></div>
          <div className="vbox grow">
            <span className="ai-usage-landing-name">{billboard.featured.name ?? billboard.featured.providerId}</span>
            {ROLE_COPY[billboard.featured.role] && <span className="ai-usage-landing-role">{ROLE_COPY[billboard.featured.role]}</span>}
          </div>
        </div>
      )}
    </>
  );
}

function LandingScreen({ billboard, mode, nav }) {
  return (
    <>
      <Header title="AI usage" nav={nav} />
      <div className="ai-usage-landing"><LandingQuote billboard={billboard} /></div>
      <div className="ai-usage-landing-actions">
        <button className="ai-usage-landing-continue" onClick={() => nav("list")}>Continue</button>
        {billboard.share && <button className="ai-usage-landing-copy">Copy</button>}
      </div>
      {mode === "latest" && <span className="ai-usage-landing-note">Earlier update</span>}
    </>
  );
}

function GuideItem({ color, title, desc }) {
  return (
    <div className="ai-usage-guide-item">
      <span className="ai-usage-guide-dot" style={{ background: color }} />
      <div className="ai-usage-guide-text">
        <span className="ai-usage-guide-title">{title}</span>
        <span className="ai-usage-guide-desc">{desc}</span>
      </div>
    </div>
  );
}

function Guide({ nav }) {
  return (
    <>
      <DetailHeader title="Status colors" back={() => nav("list")} />
      <div className="ai-usage-guide-body">
        <GuideItem color={COLOR.ok} title="Healthy" desc={"Plenty of headroom — under 70% used."} />
        <GuideItem color={COLOR.wait} title="Caution" desc="Getting close — 70 to 89% used." />
        <GuideItem color={COLOR.crit} title="Critical" desc={"At or near your limit — 90% and up."} />
      </div>
    </>
  );
}

function About({ nav }) {
  return (
    <>
      <DetailHeader title="About" back={() => nav("list")} />
      <div className="ai-usage-guide-body">
        <div className="ai-usage-guide-text">
          <span className="ai-usage-guide-title">AI usage</span>
          <span className="ai-usage-guide-desc">Local GNOME Shell indicator for AI coding limits. Cursor is live; OpenCode and Claude Code are next.</span>
        </div>
        <div className="ai-usage-guide-text">
          <span className="ai-usage-guide-title">Extension v1</span>
          <span className="ai-usage-guide-desc">{`Daemon v${MOCK.version} · updated ${relativeTime(MOCK.updated_at)}`}</span>
        </div>
      </div>
      <button className="ai-usage-dash-btn ai-usage-refresh-btn">Refresh now</button>
    </>
  );
}

function Popover({ children }) {
  return <div className="popover"><div className="screen">{children}</div></div>;
}

/* Screen state machine; each popover keeps its own state so every cell is clickable. */
const SCREENS = {
  "list-rolling":   { screen: "list", picks: [] },
  "list-weekly":    { screen: "list", picks: ["weekly"] },
  "list-monthly":   { screen: "list", picks: ["weekly", "monthly"] },
  "detail-0":       { screen: "detail", toolId: "cursor" },
  "detail-1":       { screen: "detail", toolId: "claude" },
  "detail-2":       { screen: "detail", toolId: "opencode" },
  "detail-3":       { screen: "detail", toolId: "pi" },
  "sessions-active": { screen: "sessions", toolId: "cursor", filter: "active" },
  "sessions-paused": { screen: "sessions", toolId: "cursor", filter: "paused" },
  "landing":        { screen: "landing", mode: "fresh" },
  "landing-latest": { screen: "landing", mode: "latest" },
  "guide":          { screen: "guide" },
  "about":          { screen: "about" },
};

function PopoverApp({ name }) {
  const [st, setSt] = useState({ picks: [], toolId: null, filter: "active", mode: "fresh", ...SCREENS[name] });
  const nav = (screen, extra = {}) => setSt((s) => ({ ...s, ...extra, screen }));
  // The picker is a bulk SetPrimary applied in order, so a provider with no meter of the
  // chosen kind keeps whatever it showed before (Claude stays on Weekly under Monthly).
  const tools = st.picks.reduce((ts, k) => withWindow(ts, k), MOCK.tools);
  const tool = tools.find((t) => t.id === st.toolId);
  const billboard = st.mode === "latest" ? MOCK.latestMessage : MOCK.billboard;
  let body;
  if (st.screen === "detail" && tool) body = <DetailScreen tool={tool} nav={nav} />;
  else if (st.screen === "sessions" && tool) body = <SessionList tool={tool} nav={nav} filter={st.filter} setFilter={(f) => setSt((s) => ({ ...s, filter: f }))} />;
  else if (st.screen === "landing" && billboard) body = <LandingScreen billboard={billboard} mode={st.mode} nav={nav} />;
  else if (st.screen === "guide") body = <Guide nav={nav} />;
  else if (st.screen === "about") body = <About nav={nav} />;
  else body = <ListScreen tools={tools} nav={nav} hasLatest={!!MOCK.latestMessage} onWindow={(k) => setSt((s) => ({ ...s, picks: [...s.picks, k] }))} />;
  return <div data-screen={name} ref={(el) => { if (el) el.setAttribute("data-h", String(el.getBoundingClientRect().height)); }}><Popover>{body}</Popover></div>;
}

function Gallery() {
  return (
    <div className="gallery">
      <h1>AI usage popover</h1>
      <p className="lead">React recreation (left) next to the reference screenshot (right). Cells are interactive.</p>
      <div className="cells">
        {Object.keys(SCREENS).map((name) => (
          <div className="cell" key={name}>
            <h2>{name}</h2>
            <div className="pair">
              <div><div className="col-label">React</div><PopoverApp name={name} /></div>
              <div><div className="col-label">Reference</div><img className="ref" src={`shots/${name}.png`} alt={name} /></div>
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

const params = new URLSearchParams(location.search);
const only = params.get("screen");
const root = ReactDOM.createRoot(document.getElementById("root"));
if (only && SCREENS[only]) {
  document.body.style.background = "#202023";
  document.documentElement.style.background = "#202023";
  root.render(<div className="diff-root"><PopoverApp name={only} /></div>);
} else {
  root.render(<Gallery />);
}
</script>
</body>
</html>
